name: NRC update tracker

on:
  workflow_dispatch:
  schedule:
    # 매일 오전 10시(KST)에 자동 확인합니다.
    - cron: "0 1 * * *"

permissions:
  contents: read

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Restore previous comparison baseline
        uses: actions/cache@v6
        with:
          path: |
            data/state.json
            pdf_archive/
          key: nrc-baseline-${{ github.run_id }}
          restore-keys: |
            nrc-baseline-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest -v

      - name: Check NRC updates
        shell: bash
        run: |
          set +e
          if [[ -f data/state.json ]]; then
            python tracker.py --pdf-archive pdf_archive
          else
            python tracker.py --bootstrap --pdf-archive pdf_archive
          fi
          code=$?
          if [[ $code -ne 0 && $code -ne 2 ]]; then
            exit "$code"
          fi

      - name: Upload generated state and report
        uses: actions/upload-artifact@v7
        with:
          name: nrc-tracker-result
          path: |
            data/state.json
            reports/
            pdf_archive/
