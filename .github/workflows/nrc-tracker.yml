name: NRC update tracker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest -v

      - name: Check NRC updates
        shell: bash
        run: |
          set +e
          if [[ -f data/state.json ]]; then
            python tracker.py
          else
            python tracker.py --bootstrap
          fi
          code=$?
          if [[ $code -ne 0 && $code -ne 2 ]]; then
            exit "$code"
          fi

      - name: Upload generated state and report
        uses: actions/upload-artifact@v4
        with:
          name: nrc-tracker-result
          path: |
            data/state.json
            reports/
